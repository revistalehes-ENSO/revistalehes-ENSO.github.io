# Revista LEHES · publicación automática
# Cada vez que se suben cambios a la rama main, GitHub:
#   1. genera las páginas de los artículos, el sitemap y las imágenes para compartir
#   2. publica el sitio en GitHub Pages
# Requisito (una sola vez): Settings → Pages → Source: "GitHub Actions".
name: Publicar LEHES

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar herramientas
        run: pip install markdown pillow
      - name: Generar páginas de artículos, sitemap y feed
        run: python herramientas/generar.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
